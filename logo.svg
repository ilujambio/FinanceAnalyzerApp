<svg xmlns="http://www.w3.org/2000/svg" viewBox="0 0 100 100">
  <defs>
    <linearGradient id="silver-blue" x1="0%" y1="0%" x2="100%" y2="100%">
      <stop offset="0%" stop-color="#38BDF8" />
      <stop offset="50%" stop-color="#CBD5E1" />
      <stop offset="100%" stop-color="#0284C7" />
    </linearGradient>
    <linearGradient id="shell-dark" x1="0%" y1="100%" x2="0%" y2="0%">
      <stop offset="0%" stop-color="#1E293B" />
      <stop offset="100%" stop-color="#334155" />
    </linearGradient>
    <radialGradient id="pearl-glow" cx="50%" cy="50%" r="50%">
      <stop offset="0%" stop-color="#F8FAFC" />
      <stop offset="40%" stop-color="#7DD3FC" />
      <stop offset="100%" stop-color="#0284C7" stop-opacity="0" />
    </radialGradient>
  </defs>
  <!-- Dark Emblem Base -->
  <rect x="6" y="6" width="88" height="88" rx="22" fill="#151D30" stroke="#26354A" stroke-width="3" />
  
  <!-- Geometric Stylized Oyster Shell Fans -->
  <path d="M50 78 C25 78 18 55 24 38 C32 18 68 18 76 38 C82 55 75 78 50 78 Z" fill="url(#shell-dark)" stroke="#334155" stroke-width="1.5"/>
  <path d="M50 76 L26 40 L50 22 L74 40 Z" fill="none" stroke="url(#silver-blue)" stroke-width="2.5" stroke-linejoin="round"/>
  <path d="M50 76 L38 32 L50 22 L62 32 Z" fill="none" stroke="#38BDF8" stroke-width="1.5" stroke-opacity="0.8"/>
  <path d="M50 76 L50 22" fill="none" stroke="#E2E8F0" stroke-width="2"/>
  
  <!-- Glowing Pearl Core -->
  <circle cx="50" cy="58" r="12" fill="url(#pearl-glow)" />
  <circle cx="50" cy="58" r="6" fill="#F8FAFC" stroke="#38BDF8" stroke-width="1.5" />
  
  <!-- Upward Trend Arrow -->
  <path d="M20 72 L36 58 L52 64 L80 30" fill="none" stroke="#38BDF8" stroke-width="3.5" stroke-linecap="round" stroke-linejoin="round"/>
  <polygon points="80,24 85,33 75,33" fill="#38BDF8"/>
</svg>
